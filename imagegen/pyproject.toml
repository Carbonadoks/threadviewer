[project]
name = "imagegen"
version = "0.1.0"
description = "Low-latency local image generation backend"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.1.0",
    "diffusers @ git+https://github.com/huggingface/diffusers.git",
    "fastapi>=0.115.0",
    "pillow>=10.4.0",
    "pydantic>=2.8.0",
    "safetensors>=0.4.5",
    "torch @ https://download-r2.pytorch.org/whl/cu126/torch-2.12.0%2Bcu126-cp312-cp312-manylinux_2_28_x86_64.whl",
    "torchvision @ https://download-r2.pytorch.org/whl/cu126/torchvision-0.27.0%2Bcu126-cp312-cp312-manylinux_2_28_x86_64.whl",
    "transformers>=4.48.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false
